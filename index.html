<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nazimen BNS | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4); }
        
        body { 
            background: #000; 
            color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; 
            overflow-x: hidden; -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* НӘЗІК ҚОЗҒАЛАТЫН АЛТЫН ШАҢ ЭФФЕКТІСІ */
        .gold-dust {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2; pointer-events: none; z-index: 1;
            animation: dustMove 60s linear infinite;
        }
        @keyframes dustMove {
            from { background-position: 0 0; }
            to { background-position: 500px 1000px; }
        }

        .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 10px; z-index: 10; position: relative; min-height: 95vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin: 20px 0; }
        .grid-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(212,175,55,0.2); border-radius: 15px; padding: 20px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .grid-item img { width: 85%; height: 60px; object-fit: contain; }
        .grid-item span { font-size: 0.65rem; font-weight: 800; margin-top: 10px; color: #ddd; text-align: center; line-height: 1.2; }

        .car-accent { grid-column: 2; grid-row: 2; background: rgba(212,175,55,0.1); border: 2px solid var(--gold); transform: scale(1.25); box-shadow: 0 0 30px var(--gold-glow); z-index: 5; }
        .car-accent img { height: 70px; }

        .btn-main { background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); color: #000; border: none; width: 100%; padding: 20px; border-radius: 50px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 30px rgba(212,175,55,0.3); }

        #chestView { display: none; width: 100%; text-align: center; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; padding: 10px; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { border: 2px solid var(--gold); border-radius: 30px; width: 85%; padding: 40px 20px; text-align: center; background: #000; box-shadow: 0 0 50px var(--gold-glow); }
    </style>
</head>
<body>
    <div class="gold-dust"></div>

    <div class="container" id="mainScene">
        <h2 style="color:var(--gold); font-weight:900; letter-spacing:4px;">BNS PREMIUM</h2>
        <div class="prize-grid">
            <div class="grid-item"><img src="iphone.png"><span>IPHONE</span></div>
            <div class="grid-item"><img src="dyson.png"><span>DYSON</span></div>
            <div class="grid-item"><img src="golden.png"><span>АЛТЫН</span></div>
            <div class="grid-item"><img src="bag.png"><span>КОСМЕТИЧКА</span></div>
            <div class="grid-item car-accent"><img src="elantra.png"><span>ELANTRA</span></div>
            <div class="grid-item"><img src="money.png"><span>100.000₸</span></div>
            <div class="grid-item"><img src="parfum.png"><span>ПАРФЮМ</span></div>
            <div class="grid-item"><img src="nazzi.png"><span>АДВЕНТ</span></div>
            <div class="grid-item"><img src="satuar.png"><span>SATWÁR</span></div>
            <div class="grid-item"><img src="cosmetic.png"><span>КОСМЕТИКА</span></div>
            <div class="grid-item"><img src="cushion.png"><span>КУШОН</span></div>
            <div class="grid-item" style="border-color: #25d366;"><img src="china.png"><span>ҚЫТАЙҒА БИЗНЕС ТУР</span></div>
        </div>
        <button class="btn-main" id="startBtn" onclick="openChests()">СЫЙЛЫҒЫМДЫ АШУ</button>
    </div>

    <div class="container" id="chestView">
        <h1 style="color:var(--gold); font-weight:900;">12 АЛТЫН ҚОБДИША</h1>
        <div class="chests-grid" id="gridBoxes">
            <script>for(let i=0; i<12; i++) document.write('<div class="box-item" onclick="revealBox(this)"><img src="chest.png" style="width:100%;"></div>');</script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 style="color:var(--gold); font-weight:900;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <div id="wOut"></div>
            <div id="wId" style="color:var(--gold); font-weight:900; font-size:1.2rem; margin:15px 0; border: 1px dashed var(--gold); padding: 5px;"></div>
            <button class="btn-main" onclick="backToMenu()">МӘЗІРГЕ ОРАЛУ</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const p = urlParams.get('prize') || "ПАРФЮМ";
        const att = urlParams.get('attempt') || "ID-000";
        let isPlayed = false;

        function openChests() {
            if(isPlayed) { alert("Сіз өз мүмкіндігіңізді қолдандыңыз!"); return; }
            document.getElementById('mainScene').style.display='none'; 
            document.getElementById('chestView').style.display='flex'; 
        }

        function revealBox(el) {
            if(isPlayed) return;
            isPlayed = true;
            el.style.opacity="0.4";
            setTimeout(() => {
                const imgs = {"Алтын":"golden.png","Айфон":"iphone.png","Дайсон":"dyson.png","Парфюм":"parfum.png","КОСМЕТИЧКА":"bag.png","Косметика":"cosmetic.png","Көлік":"elantra.png","100.000₸":"money.png","Satwár":"satuar.png","Кушон":"cushion.png","Назимен адвент":"nazzi.png","Қытайға Бизнес тур":"china.png"};
                document.getElementById('wOut').innerHTML = `<img src="${imgs[p] || 'parfum.png'}" style="width:150px;"><br><h3>${p}</h3>`;
                document.getElementById('wId').innerText = "GIFT ID: " + att;
                document.getElementById('winModal').style.display='flex';
                confetti({particleCount:150, spread:70, origin:{y:0.7}});
            }, 600);
        }

        function backToMenu() {
            document.getElementById('winModal').style.display='none';
            document.getElementById('chestView').style.display='none';
            document.getElementById('mainScene').style.display='flex';
            document.getElementById('startBtn').innerText = "МҮМКІНДІК ҚОЛДАНЫЛДЫ";
            document.getElementById('startBtn').style.opacity = "0.5";
            // Мәліметті ботқа жіберу
            tg.sendData("collected_" + p);
        }
    </script>
</body>
</html>
