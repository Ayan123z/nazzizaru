<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazimen-brand | Premium Draw</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.6); --bg: #01040a; }
        body { background-color: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .header { width: 100%; padding: 15px 25px; display: flex; justify-content: space-between; font-size: 0.9rem; z-index: 10; border-bottom: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(10px); }
        .id-val { color: var(--gold); font-weight: 900; }

        .container { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        .section-title { font-weight: 900; font-size: 1.1rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin: 30px 0 25px 0; text-align: center; line-height: 1.4; }

        .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin-bottom: 35px; align-items: end; }
        .prize-card { 
            background: linear-gradient(145deg, #050a14, #0a1322); 
            border: 1.5px solid var(--gold); border-radius: 20px; padding: 15px 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 10px var(--gold-glow); transition: 0.3s;
        }
        .prize-img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 0 8px var(--gold-glow)); }
        .prize-name { font-size: 0.7rem; font-weight: 800; color: #fff; text-transform: uppercase; text-align: center; }
        
        .car-main { 
            grid-column: 2; margin: 10px 0; z-index: 15; border-width: 3px; 
            box-shadow: 0 0 35px var(--gold); padding: 20px 10px;
        }
        .car-main .prize-img { width: 160px; height: 100px; filter: drop-shadow(0 0 15px var(--gold)); }
        .car-main .prize-name { color: var(--gold); font-size: 0.9rem; letter-spacing: 2px; }

        .find-btn { 
            background: linear-gradient(45deg, #8a6d11, #f1d56e, #8a6d11); 
            color: #000; border: none; width: 100%; padding: 25px; border-radius: 60px; 
            font-size: 1.4rem; font-weight: 900; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 35px var(--gold); transition: 0.4s; margin: 30px 0;
        }

        .chests-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
        .chest-card { cursor: pointer; transition: 0.3s; text-align: center; padding: 5px; }
        .chest-img { width: 100%; max-width: 130px; filter: drop-shadow(0 0 15px var(--gold-glow)); }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.99); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { background: #050a14; border: 3px solid var(--gold); border-radius: 50px; width: 90%; max-width: 380px; padding: 60px 20px; text-align: center; }
        .res-img { width: 220px; margin-bottom: 30px; filter: drop-shadow(0 0 30px var(--gold)); }
        
        .shake { animation: shake 0.5s infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="header">
        <div>USER ID: <span class="id-val" id="userIdDisp">...</span></div>
        <div style="color: #25d366; font-weight: 900; letter-spacing: 1px;">LIVE 🟢</div>
    </div>

    <div class="container">
        <div id="prizeShowcaseArea">
            <div class="section-title">Nazzimen-қобдишасынан сыйлық таңдаңыз</div>
            <div class="prize-grid">
                <div class="prize-card"><img src="cosmitic.png" class="prize-img"><div class="prize-name">Косметика</div></div>
                <div class="prize-card"><img src="gold.png" class="prize-img"><div class="prize-name">Алтын</div></div>
                <div class="prize-card"><img src="iphone.png" class="prize-img"><div class="prize-name">iPhone</div></div>
                <div class="prize-card"><img src="dyson.png" class="prize-img"><div class="prize-name">Dyson</div></div>
                <div class="prize-card car-main"><img src="elantra.png" class="prize-img"><div class="prize-name">Elantra</div></div>
                <div class="prize-card"><img src="cushion.png" class="prize-img"><div class="prize-name">Кушон</div></div>
                <div class="prize-card"><img src="money.png" class="prize-img"><div class="prize-name">Ақша</div></div>
                <div class="prize-card"><img src="parfum.png" class="prize-img"><div class="prize-name">Парфюм</div></div>
                <div class="prize-card"><img src="bag.png" class="prize-img"><div class="prize-name">Косметичка</div></div>
            </div>
            <button class="find-btn" onclick="showChests()">🔍 Сыйлығымды табу</button>
        </div>

        <div id="chestsArea" style="display: none; width: 100%;">
            <div class="section-title">Қобдишаны таңдаңыз</div>
            <div class="chests-grid" id="chestsGrid" style="display: grid;">
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
                <div class="chest-card" onclick="openChest(this)"><img src="chest.png" class="chest-img"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <div id="resultArea"></div>
            <button onclick="location.reload()" style="background:var(--gold); border:none; padding:20px; border-radius:50px; font-weight:900; width:100%; margin-top:30px; cursor:pointer;">ЖАБУ</button>
        </div>
    </div>

    <script>
        particlesJS("particles-js", {"particles":{"number":{"value":100},"color":{"value":"#d4af37"},"size":{"value":2},"move":{"enable":true,"speed":0.8}}});
        
        // Сүйінші! Боттан келетін деректерді оқимыз
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id') || "ID ЖОҚ";
        const prizeFromBot = urlParams.get('prize') || "Парфюм"; 
        
        document.getElementById('userIdDisp').innerText = userId;

        function showChests() {
            document.getElementById('prizeShowcaseArea').style.display = 'none';
            document.getElementById('chestsArea').style.display = 'block';
        }

        function openChest(el) {
            el.classList.add('shake');

            const prizeImages = {
                "Алтын": "gold.png",
                "Айфон": "iphone.png",
                "Дайсон": "dyson.png",
                "Парфюм": "parfum.png",
                "Косметичка": "bag.png",
                "Косметика": "cosmitic.png",
                "Көлік": "elantra.png",
                "Ақша 1.000.000тг": "money.png",
                "Кушон": "cushion.png"
            };

            const finalImg = prizeImages[prizeFromBot] || "parfum.png";

            setTimeout(() => {
                document.getElementById('resultArea').innerHTML = `
                    <h1 style="color:var(--gold); font-weight:900;">ҚҰТТЫҚТАЙМЫЗ!</h1>
                    <img src="${finalImg}" class="res-img">
                    <div style="font-size:2rem; font-weight:900; color:#fff;">${prizeFromBot}</div>
                `;
                document.getElementById('winModal').style.display = 'flex';
                confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
            }, 1500);
        }
    </script>
</body>
</html>
