<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nazimen BNS | Premium Draw</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.5); }
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; z-index: 10; position: relative; box-sizing: border-box; }
        .id-badge { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; color: var(--gold); }
        .live-dot { color: #25d366; font-weight: 900; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; z-index: 10; position: relative; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* GALAXY LAYOUT */
        .galaxy-orbit { position: relative; width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
        
        .center-piece { position: absolute; width: 75%; z-index: 5; filter: drop-shadow(0 0 30px var(--gold-glow)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.03); } }
        .center-piece img { width: 100%; pointer-events: none; }

        .orbit-slot { position: absolute; width: 65px; height: 65px; background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 50%; padding: 8px; backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .orbit-slot img { width: 90%; height: 90%; object-fit: contain; }

        /* Орналасу */
        .s1 { transform: translate(0, -150px); } .s2 { transform: translate(95px, -115px); }
        .s3 { transform: translate(140px, -35px); } .s4 { transform: translate(130px, 65px); }
        .s5 { transform: translate(65px, 140px); } .s6 { transform: translate(-65px, 140px); }
        .s7 { transform: translate(-130px, 65px); } .s8 { transform: translate(-140px, -35px); }
        .s9 { transform: translate(-95px, -115px); } .s10 { transform: translate(0, 160px); }

        .btn { background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); color: #000; border: none; width: 90%; padding: 22px; border-radius: 50px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 30px rgba(212,175,55,0.4); z-index: 20; }

        /* CHESTS VIEW */
        #chestView { display: none; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; }
        .chest-item { cursor: pointer; transition: 0.3s; }
        .chest-item img { width: 100%; filter: drop-shadow(0 15px 20px #000); }

        /* WIN MODAL */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { background: #080a10; border: 2px solid var(--gold); border-radius: 35px; width: 85%; padding: 40px 20px; text-align: center; box-shadow: 0 0 50px var(--gold-glow); position: relative; }
        .win-img { width: 200px; height: 200px; object-fit: contain; margin: 20px 0; filter: drop-shadow(0 0 20px var(--gold-glow)); }
        
        /* Мотивациялық жазу (Басында жасырулы) */
        #motoText { display: none; color: #fff; font-weight: 700; font-size: 1.1rem; margin-top: 20px; text-shadow: 0 0 10px var(--gold-glow); animation: motoPulse 0.5s ease-in-out; }
        @keyframes motoPulse { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="header">
        <div class="id-badge">ID: <span id="userIdDisp">...</span></div>
        <div class="live-dot">LIVE 🟢</div>
    </div>

    <div class="container" id="mainView">
        <div class="galaxy-orbit">
            <div class="center-piece">
                <img src="elantra.png" alt="Hyundai Elantra">
                <div style="font-weight:900; color:var(--gold); margin-top:10px; font-size:1.1rem; text-shadow:0 0 10px #000;">ELANTRA</div>
            </div>
            <div class="orbit-slot s1"><img src="iphone.png"></div>
            <div class="orbit-slot s2"><img src="dyson.png"></div>
            <div class="orbit-slot s3"><img src="golden.png"></div>
            <div class="orbit-slot s4"><img src="money.png"></div>
            <div class="orbit-slot s5"><img src="money.png"></div>
            <div class="orbit-slot s6"><img src="parfum.png"></div>
            <div class="orbit-slot s7"><img src="nazzi.png"></div>
            <div class="orbit-slot s8"><img src="satuar.png"></div>
            <div class="orbit-slot s9"><img src="cosmetic.png"></div>
            <div class="orbit-slot s10"><img src="cushion.png"></div>
        </div>
        <button class="btn" onclick="openChests()">ҚОБДИШАНЫ АШУ</button>
    </div>

    <div class="container" id="chestView">
        <h1 style="color:var(--gold); font-weight:900; letter-spacing:2px;">11 АЛТЫН ҚОБДИША</h1>
        <p style="opacity:0.6;">Сыйлық жасырылған қобдишаны таңдаңыз</p>
        <div class="chests-grid">
            <script>
                for(let i=0; i<11; i++) document.write('<div class="chest-item" onclick="handleWin(this)"><img src="chest.png"></div>');
            </script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 style="color:var(--gold); font-weight:900; margin:0; letter-spacing:2px;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <div id="winOutput"></div>
            <div id="giftIdTag" style="color:var(--gold); font-weight:900; font-size:1.2rem; margin:15px 0;"></div>
            
            <div id="motoText">
                🔄 КЕЛЕСІ ЖОЛЫ<br>
                БҰДАН ДА ҮЛКЕН<br>
                СЫЙЛЫҚ КҮТІП ТҰР! 🎁
            </div>
            
            <button class="btn" id="okBtn" onclick="okAction()">ОК</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        particlesJS("particles-js", {"particles":{"number":{"value":50},"color":{"value":"#d4af37"},"move":{"enable":true,"speed":1}}});
        const prize = new URLSearchParams(window.location.search).get('prize') || "ПАРФЮМ";
        const attempt = new URLSearchParams(window.location.search).get('attempt') || "0000";
        document.getElementById('userIdDisp').innerText = new URLSearchParams(window.location.search).get('id') || "User";

        function openChests() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('chestView').style.display = 'flex';
        }

        function handleWin(el) {
            el.style.opacity = "0.4";
            if(window.navigator.vibrate) window.navigator.vibrate(50);
            setTimeout(() => {
                const prizeMap = { 
                    "Алтын":"golden.png", "Айфон":"iphone.png", "Дайсон":"dyson.png", "Парфюм":"parfum.png", 
                    "КОСМЕТИЧКА":"bag.png", "Косметика":"cosmetic.png", "Көлік":"elantra.png", 
                    "100к тг":"money.png", "1.000.000 тг":"money.png", "Satwár":"satuar.png", 
                    "Кушон":"cushion.png", "Назимен адвент":"nazzi.png" 
                };
                document.getElementById('winOutput').innerHTML = `
                    <img src="${prizeMap[prize] || 'parfum.png'}" class="win-img">
                    <h1 style="text-transform:uppercase; margin:0; font-size:1.8rem;">${prize}</h1>
                `;
                document.getElementById('giftIdTag').innerText = "GIFT ID: " + attempt;
                document.getElementById('winModal').style.display = 'flex';
                confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 }, colors: ['#d4af37', '#ffffff'] });
            }, 500);
        }

        function okAction() {
            // ЭФФЕКТ: ОК басқанда батырманы жасырып, мотивацияны шығарамыз
            document.getElementById('giftIdTag').style.display = 'none';
            document.getElementById('outArea').style.display = 'none'; // Сыйлықты жасыру (сәйкес идентификатор болса)
            document.getElementById('outAreaParent').style.display = 'none'; // Немесе оның ата-анасын
            // Егер сыйлық пен ата-анасын жасырғың келсе, 'revealPrize' функциясында оларға ID беру керек
            // Қазіргі кодта олар 'winOutput' ішінде, сондықтан оны жасырамыз:
            document.getElementById('winOutput').style.display = 'none';
            
            document.getElementById('okBtn').style.display = 'none';
            document.getElementById('motoText').style.display = 'block';
            
            // 2 секундтан кейін сайтты жабамыз
            setTimeout(() => {
                tg.sendData("gift_collected");
                tg.close();
            }, 2500);
        }
    </script>
</body>
</html>
