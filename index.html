<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nazimen BNS | Final Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.6); }
        
        body { 
            background: #000; color: #fff; font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* NETWORK BACKGROUND */
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 10px; z-index: 10; position: relative; min-height: 95vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 3x4 GRID РЕТТІЛІГІ */
        .prize-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            width: 100%; 
            margin: 20px 0; 
        }
        
        .grid-item { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(212, 175, 55, 0.15); 
            border-radius: 12px; padding: 18px 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .grid-item img { width: 70%; height: 45px; object-fit: contain; }
        .grid-item span { font-size: 0.55rem; font-weight: 800; margin-top: 8px; color: #bbb; text-align: center; text-transform: uppercase; }

        /* 🚗 ELANTRA CENTER ACCENT (30% LARGER) */
        .car-accent { 
            grid-column: 2; grid-row: 2; 
            border: 2.5px solid var(--gold); 
            box-shadow: 0 0 35px var(--gold-glow); 
            transform: scale(1.3); 
            background: rgba(212, 175, 55, 0.1); 
            z-index: 20;
        }
        .car-accent img { width: 95%; height: 55px; }

        .btn-main { 
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); 
            color: #000; border: none; width: 90%; padding: 22px; 
            border-radius: 50px; font-size: 1.2rem; font-weight: 900; 
            text-transform: uppercase; cursor: pointer; margin-top: 35px; 
            box-shadow: 0 10px 30px rgba(212,175,55,0.4); 
        }

        #chestView { display: none; width: 100%; text-align: center; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }

        /* SOFT INTRIGUE ANIMATION */
        .box-item.wait-anim { 
            animation: softBreath 1.2s ease-in-out infinite; 
            filter: drop-shadow(0 0 15px var(--gold));
        }
        @keyframes softBreath { 
            0%, 100% { transform: scale(1); } 
            50% { transform: scale(1.08); } 
        }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.97); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { border: 2px solid var(--gold); border-radius: 30px; width: 85%; padding: 40px 20px; text-align: center; background: #000; box-shadow: 0 0 50px var(--gold-glow); }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container" id="mainScene">
        <h2 style="color:var(--gold); font-weight:900; letter-spacing:5px; text-shadow: 0 0 15px rgba(212,175,55,0.4);">NAZIMEN BNS</h2>
        
        <div class="prize-grid">
            <div class="grid-item"><img src="iphone.png"><span>IPHONE</span></div>
            <div class="grid-item"><img src="dyson.png"><span>DYSON</span></div>
            <div class="grid-item"><img src="golden.png"><span>АЛТЫН</span></div>
            
            <div class="grid-item"><img src="bag.png"><span>КОСМЕТИЧКА</span></div>
            <div class="grid-item car-accent"><img src="elantra.png"><span>ELANTRA</span></div>
            <div class="grid-item"><img src="money.png"><span>100.000₸</span></div>
            
            <div class="grid-item"><img src="parfum.png"><span>ПАРФЮМ</span></div>
            <div class="grid-item"><img src="nazzi.png"><span>АДВЕНТ</span></div>
            <div class="grid-item"><img src="satuar.png"><span>SATWÁR</span></div>
            
            <div class="grid-item"><img src="cosmetic.png"><span>КОСМЕТИКА</span></div>
            <div class="grid-item"><img src="cushion.png"><span>КУШОН</span></div>
            <div class="grid-item" style="border-color: #25d366;"><img src="china.png"><span>ҚЫТАЙҒА БИЗНЕС ТУР</span></div>
        </div>
        
        <button class="btn-main" onclick="openChests()">СЫЙЛЫҒЫМДЫ АШУ</button>
    </div>

    <div class="container" id="chestView">
        <h1 style="color:var(--gold); font-weight:900;">САНДЫҚТЫ ТАҢДАҢЫЗ</h1>
        <div class="chests-grid">
            <script>for(let i=0; i<12; i++) document.write('<div class="box-item" onclick="revealProcess(this)"><img src="chest.png" style="width:100%;"></div>');</script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 style="color:var(--gold); font-weight:900;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <div id="wOut"></div>
            <div id="wId" style="color:var(--gold); font-weight:900; font-size:1.1rem; margin:15px 0; border: 1px dashed var(--gold); padding: 5px;"></div>
            <button class="btn-main" onclick="location.reload()">МӘЗІРГЕ ОРАЛУ</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const p = urlParams.get('prize') || "ПАРФЮМ";
        const att = urlParams.get('attempt') || "ID-000";
        let isPlayed = false;

        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 70 },
                "color": { "value": "#d4af37" },
                "line_linked": { "enable": true, "distance": 140, "color": "#d4af37", "opacity": 0.35, "width": 1 },
                "move": { "enable": true, "speed": 1.8 }
            }
        });

        function openChests() { 
            document.getElementById('mainScene').style.display='none'; 
            document.getElementById('chestView').style.display='flex'; 
        }

        function revealProcess(el) {
            if(isPlayed) return;
            el.classList.add('wait-anim');
            
            setTimeout(() => {
                isPlayed = true;
                const imgs = {"Алтын":"golden.png","Айфон":"iphone.png","Дайсон":"dyson.png","Парфюм":"parfum.png","КОСМЕТИЧКА":"bag.png","Косметика":"cosmetic.png","Көлік":"elantra.png","100.000₸":"money.png","Satwár":"satwar.png","Кушон":"cushion.png","Назимен адвент":"nazzi.png","Қытайға Бизнес тур":"china.png"};
                document.getElementById('wOut').innerHTML = `<h3>${p}</h3>`;
                document.getElementById('wId').innerText = "GIFT ID: " + att;
                document.getElementById('winModal').style.display='flex';
                confetti({particleCount:160, spread:70, origin:{y:0.7}, colors:['#d4af37','#ffffff']});
            }, 1300);
        }
    </script>
</body>
</html>
