<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nazimen BNS | Final Luxury Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.3); }
        body { 
            background: #000; color: #fff; font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }
        
        /* ✨ ЖЕҢІЛ АЛТЫН ТҮСТЕС ЭФФЕКТ (GOLD DUST) */
        #particles-js { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none;
        }

        .container { 
            width: 100%; max-width: 480px; margin: 0 auto; padding: 10px; 
            z-index: 10; position: relative; min-height: 95vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        
        /* 📦 ҰЯШЫҚ РЕТТІЛІГІ (3x4) */
        .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin: 20px 0; }
        
        .grid-item { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(212, 175, 55, 0.15); 
            border-radius: 12px; padding: 15px 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(2px);
        }
        .grid-item img { width: 70%; height: 45px; object-fit: contain; }
        .grid-item span { font-size: 0.55rem; font-weight: 800; margin-top: 8px; color: #aaa; text-align: center; text-transform: uppercase; }

        /* 🚗 ELANTRA CENTER ACCENT (1.25X) */
        .car-accent { 
            grid-column: 2; grid-row: 2; border: 2px solid var(--gold); 
            box-shadow: 0 0 25px var(--gold-glow); transform: scale(1.25); 
            background: rgba(212, 175, 55, 0.08); z-index: 20; 
        }

        .btn-main { 
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); 
            color: #000; border: none; width: 90%; padding: 20px; 
            border-radius: 50px; font-size: 1.1rem; font-weight: 900; 
            margin-top: 25px; cursor: pointer; box-shadow: 0 10px 30px rgba(212,175,55,0.4); 
        }

        #chestView { display: none; width: 100%; text-align: center; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }

        /* 🎰 ИНТРИГА (0.7s) */
        .box-item.shake { animation: lightShake 0.35s ease-in-out infinite; filter: drop-shadow(0 0 15px var(--gold)); }
        @keyframes lightShake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(4deg); } 75% { transform: rotate(-4deg); } }
        
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { border: 2px solid var(--gold); border-radius: 30px; width: 85%; padding: 35px 20px; text-align: center; background: #000; box-shadow: 0 0 50px var(--gold-glow); }
        
        #wOut img { 
            width: 160px; height: auto; margin-bottom: 15px; 
            filter: drop-shadow(0 0 15px var(--gold));
            animation: prizePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes prizePop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container" id="mainScene">
        <h2 style="color:var(--gold); font-weight:900; letter-spacing:4px; text-shadow: 0 0 10px var(--gold-glow);">NAZIMEN BNS</h2>
        
        <div class="prize-grid">
            <div class="grid-item"><img src="iphone.png"><span>IPHONE</span></div>
            <div class="grid-item"><img src="dyson.png"><span>DYSON</span></div>
            <div class="grid-item"><img src="golden.png"><span>АЛТЫН</span></div>
            
            <div class="grid-item"><img src="bag.png"><span>КОСМЕТИЧКА</span></div>
            <div class="grid-item car-accent"><img src="elantra.png"><span>ELANTRA</span></div>
            <div class="grid-item"><img src="money.png"><span>100.000₸</span></div>
            
            <div class="grid-item"><img src="parfum.png"><span>ПАРФЮМ</span></div>
            <div class="grid-item"><img src="nazzi.png"><span>АДВЕНТ</span></div>
            <div class="grid-item"><img src="satuar.png"><span>SATWÁR</span></div>
            
            <div class="grid-item"><img src="cosmetic.png"><span>КОСМЕТИКА</span></div>
            <div class="grid-item"><img src="cushion.png"><span>КУШОН</span></div>
            <div class="grid-item" style="border-color: #25d366; opacity: 0.9;"><img src="china.png"><span>БИЗНЕС ТУР</span></div>
        </div>
        
        <button class="btn-main" onclick="openChests()">СЫЙЛЫҒЫМДЫ АШУ</button>
    </div>

    <div class="container" id="chestView">
        <h1 style="color:var(--gold); font-weight:900;">САНДЫҚТЫ ТАҢДАҢЫЗ</h1>
        <div class="chests-grid">
            <script>for(let i=0; i<12; i++) document.write('<div class="box-item" onclick="revealDrama(this)"><img src="chest.png" style="width:100%;"></div>');</script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 style="color:var(--gold); font-weight:900; margin-bottom: 20px;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <div id="wOut"></div>
            <div id="wId" style="color:var(--gold); font-size:0.9rem; margin:15px 0; border: 1px dashed var(--gold); padding: 5px; opacity: 0.8;"></div>
            <button class="btn-main" onclick="location.reload()">МӘЗІРГЕ ОРАЛУ</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ✨ НӘЗІК ЖӘНЕ КЕДЕРГІ КЕЛТІРМЕЙТІН АЛТЫН ЭФФЕКТ
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#d4af37" },
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.3, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } 
                },
                "size": { 
                    "value": 2.5, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 2, "size_min": 0.5, "sync": false } 
                },
                "line_linked": { "enable": false }, // Сызықтарды өшірдік (кедергі жасамау үшін)
                "move": { 
                    "enable": true, 
                    "speed": 0.8, 
                    "direction": "top", // Жоғары қарай баяу қалқиды
                    "random": true, 
                    "out_mode": "out" 
                }
            }
        });

        const tg = window.Telegram.WebApp; tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const p = urlParams.get('prize') || "ПАРФЮМ";
        const att = urlParams.get('attempt') || "ID-000";
        let isPlayed = false;

        const prizeImages = {
            "Алтын": "golden.png", "Айфон": "iphone.png", "Дайсон": "dyson.png", "Парфюм": "parfum.png",
            "Косметичка": "bag.png", "Косметика": "cosmetic.png", "Көлік": "elantra.png",
            "100.000₸": "money.png", "Кушон": "cushion.png", "Қытайға Бизнес тур": "china.png",
            "Satwár": "satuar.png", "Адвент": "nazzi.png"
        };

        function openChests() { 
            document.getElementById('mainScene').style.display='none'; 
            document.getElementById('chestView').style.display='flex'; 
        }

        function revealDrama(el) {
            if(isPlayed) return; el.classList.add('shake');
            if(window.navigator.vibrate) window.navigator.vibrate(40);

            setTimeout(() => {
                isPlayed = true; 
                const imgFile = prizeImages[p] || "chest.png";
                document.getElementById('wOut').innerHTML = `
                    <img src="${imgFile}">
                    <h3 style="color:var(--gold); font-size: 1.6rem; margin: 0; text-transform: uppercase;">${p}</h3>
                `;
                document.getElementById('wId').innerText = "GIFT ID: " + att; 
                document.getElementById('winModal').style.display='flex';
                confetti({particleCount: 150, spread: 70, origin: { y: 0.7 }, colors: ['#d4af37', '#ffffff']});
            }, 700); 
        }
    </script>
</body>
</html>
