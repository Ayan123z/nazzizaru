<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nazimen BNS | Ultra Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.5); }
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; z-index: 10; box-sizing: border-box; }
        .id-badge { border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; color: var(--gold); font-weight: 700; background: rgba(212,175,55,0.1); }
        .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 15px; z-index: 10; position: relative; min-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* PRIZE GRID */
        .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin: 20px 0; }
        .grid-item { background: rgba(255,255,255,0.05); border: 1.5px solid rgba(212,175,55,0.2); border-radius: 15px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; }
        .grid-item img { width: 85%; height: 55px; object-fit: contain; }
        .grid-item span { font-size: 0.6rem; font-weight: 800; margin-top: 8px; color: #ccc; text-align: center; text-transform: uppercase; }

        /* CENTER CAR ACCENT */
        .car-accent { grid-column: 2; grid-row: 2; background: rgba(212,175,55,0.1); border: 2px solid var(--gold); transform: scale(1.2); box-shadow: 0 0 25px var(--gold-glow); z-index: 5; }
        .car-accent img { height: 65px; filter: drop-shadow(0 0 10px var(--gold-glow)); }
        .car-accent span { color: #fff; font-size: 0.75rem; font-weight: 900; }

        .btn-main { background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); color: #000; border: none; width: 100%; padding: 22px; border-radius: 50px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 30px rgba(212,175,55,0.4); margin-top: 20px; }

        /* 12 CHESTS */
        #chestView { display: none; width: 100%; text-align: center; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; padding: 10px; }

        /* MODAL */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { background: #0a0a0a; border: 2px solid var(--gold); border-radius: 35px; width: 85%; padding: 40px 20px; text-align: center; box-shadow: 0 0 50px var(--gold-glow); }
        .moto { display: none; color: #fff; font-weight: 900; font-size: 1.2rem; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="header">
        <div class="id-badge">ID: <span id="userIdDisp">...</span></div>
        <div style="color:#25d366; font-weight:900; font-size:0.8rem;">BNS LIVE 🟢</div>
    </div>

    <div class="container" id="mainScene">
        <h2 style="color:var(--gold); font-weight:900; letter-spacing:4px; margin:0;">ELANTRA DRAW</h2>
        <div class="prize-grid">
            <div class="grid-item"><img src="iphone.png"><span>IPHONE</span></div>
            <div class="grid-item"><img src="dyson.png"><span>DYSON</span></div>
            <div class="grid-item"><img src="golden.png"><span>АЛТЫН</span></div>
            <div class="grid-item"><img src="money.png"><span>1.000.000₸</span></div>
            <div class="grid-item car-accent"><img src="elantra.png"><span>ELANTRA</span></div>
            <div class="grid-item"><img src="money.png"><span>100к тг</span></div>
            <div class="grid-item"><img src="parfum.png"><span>ПАРФЮМ</span></div>
            <div class="grid-item"><img src="nazzi.png"><span>АДВЕНТ</span></div>
            <div class="grid-item"><img src="satuar.png"><span>SATWÁR</span></div>
            <div class="grid-item"><img src="cosmetic.png"><span>КОСМЕТИКА</span></div>
            <div class="grid-item"><img src="cushion.png"><span>КУШОН</span></div>
            <div class="grid-item"><img src="bag.png"><span>КОСМЕТИЧКА</span></div>
        </div>
        <button class="btn-main" onclick="openChests()">СЫЙЛЫҒЫМДЫ АШУ</button>
    </div>

    <div class="container" id="chestView">
        <h1 style="color:var(--gold); font-weight:900; letter-spacing:2px;">12 АЛТЫН ҚОБДИША</h1>
        <div class="chests-grid">
            <script>for(let i=0; i<12; i++) document.write('<div onclick="revealBox(this)"><img src="chest.png" style="width:100%;"></div>');</script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 id="wTitle" style="color:var(--gold); font-weight:900; margin:0; letter-spacing:2px;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <div id="wOut"></div>
            <div id="wId" style="color:var(--gold); font-weight:900; font-size:1.3rem; margin:15px 0;"></div>
            <div id="motoText" class="moto">🔄 КЕЛЕСІ ЖОЛЫ<br>БҰДАН ДА ҮЛКЕН<br>СЫЙЛЫҚ КҮТІП ТҰР! 🎁</div>
            <button class="btn-main" id="okBtn" onclick="closeSequence()">ОК</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        particlesJS("particles-js", {"particles":{"number":{"value":50},"color":{"value":"#d4af37"},"move":{"enable":true,"speed":1}}});
        const urlParams = new URLSearchParams(window.location.search);
        const p = urlParams.get('prize') || "ПАРФЮМ";
        const att = urlParams.get('attempt') || "0000";
        document.getElementById('userIdDisp').innerText = urlParams.get('id') || "User";

        function openChests() { document.getElementById('mainScene').style.display='none'; document.getElementById('chestView').style.display='flex'; }
        function revealBox(el) {
            el.style.opacity="0.4"; if(window.navigator.vibrate) window.navigator.vibrate(50);
            setTimeout(() => {
                const imgs = {"Алтын":"golden.png","Айфон":"iphone.png","Дайсон":"dyson.png","Парфюм":"parfum.png","КОСМЕТИЧКА":"bag.png","Косметика":"cosmetic.png","Көлік":"elantra.png","100к тг":"money.png","1.000.000 тг":"money.png","Satwár":"satuar.png","Кушон":"cushion.png","Назимен адвент":"nazzi.png"};
                document.getElementById('wOut').innerHTML = `<img src="${imgs[p] || 'parfum.png'}" style="width:200px; margin:20px 0;"><h1 style="text-transform:uppercase;">${p}</h1>`;
                document.getElementById('wId').innerText = "GIFT ID: " + att;
                document.getElementById('winModal').style.display='flex';
                confetti({particleCount:200, spread:80, origin:{y:0.7}, colors:['#d4af37','#ffffff']});
            }, 600);
        }
        function closeSequence() {
            document.getElementById('wTitle').style.display='none'; document.getElementById('wOut').style.display='none';
            document.getElementById('wId').style.display='none'; document.getElementById('okBtn').style.display='none';
            document.getElementById('motoText').style.display='block';
            setTimeout(() => { tg.sendData("gift_collected"); tg.close(); }, 2500);
        }
    </script>
</body>
</html>
