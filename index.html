<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nazimen Premium Draw</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.7); --bg: #000000; }
        /* Мәтінді көшіруді блоктайды */
        body { background-color: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; user-select: none; -webkit-user-select: none; }
        .header { width: 100%; padding: 20px; display: flex; justify-content: space-between; font-size: 0.9rem; border-bottom: 1px solid rgba(212, 175, 55, 0.3); box-sizing: border-box; position: sticky; top: 0; background: black; z-index: 100; }
        .id-val { color: var(--gold); font-weight: 900; }
        .container { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .section-title { font-weight: 900; font-size: 1.3rem; color: var(--gold); text-transform: uppercase; margin: 20px 0; text-align: center; line-height: 1.3; }
        .prize-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; margin-bottom: 25px; }
        .prize-card { background: #0a0a0a; border: 1px solid var(--gold); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; text-align: center; }
        .prize-img { width: 85%; height: 50px; object-fit: contain; filter: drop-shadow(0 0 5px var(--gold-glow)); }
        .car-main { grid-column: span 2; height: 120px; border-width: 2px; position: relative; box-shadow: 0 0 20px var(--gold-glow); }
        .car-main .prize-img { height: 70px; }
        .main-tag { position: absolute; top: -10px; background: var(--gold); color: #000; padding: 2px 10px; border-radius: 20px; font-size: 0.6rem; font-weight: 900; }
        .prize-name { font-size: 0.55rem; font-weight: 700; margin-top: 5px; color: #fff; text-transform: uppercase; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; margin-top: 10px; }
        .chest-card { cursor: pointer; transition: 0.3s; }
        .chest-img { width: 100%; filter: drop-shadow(0 0 10px var(--gold-glow)); }
        .open-btn { background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); color: #000; border: none; padding: 18px; border-radius: 50px; font-size: 1.1rem; font-weight: 900; width: 100%; margin-top: 20px; cursor: pointer; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { background: #000; border: 2px solid var(--gold); border-radius: 30px; width: 85%; padding: 40px 20px; text-align: center; }
        .res-img { width: 180px; height: 150px; object-fit: contain; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div>ID: <span class="id-val" id="userIdDisp">...</span></div>
        <div style="color: #25d366; font-weight: 900;">LIVE 🟢</div>
    </div>
    
    <div class="container" id="mainView">
        <div class="section-title">Nazimen қобдишасынан <br> сыйлығыңызды алыңыз</div>
        <div class="prize-grid">
            <div class="prize-card"><img src="money.png" class="prize-img"><div class="prize-name">1 МЛН ₸</div></div>
            <div class="prize-card"><img src="iphone.png" class="prize-img"><div class="prize-name">iPhone</div></div>
            <div class="prize-card"><img src="golden.png" class="prize-img"><div class="prize-name">Алтын</div></div>
            <div class="prize-card"><img src="dyson.png" class="prize-img"><div class="prize-name">Dyson</div></div>
            <div class="prize-card"><img src="nazzi.png" class="prize-img"><div class="prize-name">Адвент</div></div>
            <div class="prize-card car-main">
                <div class="main-tag">🏆 БАСТЫ СЫЙЛЫҚ</div>
                <img src="elantra.png" class="prize-img"><div class="prize-name">Elantra</div>
            </div>
            <div class="prize-card"><img src="parfum.png" class="prize-img"><div class="prize-name">Парфюм</div></div>
            <div class="prize-card"><img src="cosmetic.png" class="prize-img"><div class="prize-name">Косметика</div></div>
            <div class="prize-card"><img src="cushion.png" class="prize-img"><div class="prize-name">Кушон</div></div>
            <div class="prize-card"><img src="bag.png" class="prize-img"><div class="prize-name">Косметичка</div></div>
            <div class="prize-card"><img src="china.png" class="prize-img"><div class="prize-name">Бизнес тур</div></div>
        </div>
        <button class="open-btn" onclick="goToChests()">🎁 СЫЙЛЫҒЫМДЫ АШУ</button>
    </div>

    <div class="container" id="chestView" style="display:none;">
        <div class="section-title">Қобдишаны таңдаңыз</div>
        <div class="chests-grid">
            <script>
                for(let i=0; i<12; i++) { 
                    document.write(`<div class="chest-card" onclick="revealPrize()"><img src="chest.png" class="chest-img"></div>`); 
                }
            </script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 style="color:var(--gold); margin-bottom:5px;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <p style="color:#888; font-size:0.8rem;">Сіздің ұтысыңыз:</p>
            <div id="prizeResult"></div>
            <button onclick="closeApp()" style="background:var(--gold); color:#000; border:none; padding:15px; width:100%; border-radius:50px; font-weight:900; margin-top:20px; cursor:pointer;">БОТҚА ОРАЛУ</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // 🛑 ҚАУІПСІЗДІК: ОҢ ЖАҚ БАТЫРМА МЕН F12 БЛОКТАУ
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
        };

        const tg = window.Telegram.WebApp; 
        tg.expand();
        
        // URL-ден параметрлерді оқу (Жаңа ботқа бейімделген)
        const urlParams = new URLSearchParams(window.location.search);
        
        const userId = urlParams.get('id') || "БЕЛГІСІЗ";
        const attemptId = urlParams.get('attempt') || "test_000"; // Боттағы unique_attempt осында келеді
        let prizeFromBot = urlParams.get('prize') || "Парфюм"; 
        
        document.getElementById('userIdDisp').innerText = userId;
        
        function goToChests() {
            // LocalStorage арқылы дәл осы attempt-ті қайта ашуды блоктаймыз
            if(localStorage.getItem('opened_' + attemptId)) {
                alert('❌ Сіз бұл чектің сыйлығын ашып қойғансыз!');
                tg.close();
                return;
            }
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('chestView').style.display = 'flex';
        }
        
        function revealPrize() {
            // Сыйлық ашылған сәтте жадқа сақтаймыз
            localStorage.setItem('opened_' + attemptId, 'true'); 
            
            const prizeImgs = { 
                "Парфюм": "parfum.png", 
                "Кушон": "cushion.png", 
                "Косметичка": "bag.png", 
                "Косметика": "cosmetic.png" 
            };
            
            const img = prizeImgs[prizeFromBot] || "nazzi.png";
            document.getElementById('prizeResult').innerHTML = `<img src="${img}" class="res-img"><h3 style="font-size:1.5rem; margin:0; color:#fff;">${prizeFromBot}</h3>`;
            document.getElementById('winModal').style.display = 'flex';
            
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 3000 });
        }

        function closeApp() {
            try { tg.sendData("update_tickets"); } catch(e) {}
            tg.close();
        }
    </script>
</body>
</html>
