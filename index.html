<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nazimen Қобдишасы</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4); }
        body { 
            background: #000; color: #fff; font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }
        
        #particles-js { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none; opacity: 0.5;
        }

        .container { 
            width: 100%; max-width: 480px; margin: 0 auto; padding: 10px; 
            z-index: 10; position: relative; min-height: 95vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        
        .header-title {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 📦 ҰЯШЫҚТАР (GRID) */
        .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 95%; margin: 15px 0; }
        
        .grid-item { 
            background: rgba(255, 255, 255, 0.05); /* Мөлдір ұяшықтар */
            border: 1px solid rgba(212, 175, 55, 0.2); 
            border-radius: 15px; padding: 20px 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
            animation: floating 3s ease-in-out infinite;
        }
        .grid-item img { width: 85%; height: 60px; object-fit: contain; }
        .grid-item span { 
            font-size: 0.6rem; font-weight: 800; margin-top: 10px; 
            color: #ccc; text-align: center; text-transform: uppercase;
        }

        /* 🚗 ELANTRA ACCENT */
        .car-accent { 
            grid-column: 2; grid-row: 2; border: 2px solid var(--gold); 
            box-shadow: 0 0 25px var(--gold-glow); transform: scale(1.1); 
            position: relative;
        }
        .main-badge {
            position: absolute; top: -12px; background: var(--gold);
            color: #000; font-size: 0.5rem; font-weight: 900;
            padding: 2px 8px; border-radius: 4px; white-space: nowrap;
        }

        /* АНИМАЦИЯ */
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .btn-main { 
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); 
            color: #000; border: none; width: 85%; padding: 20px; 
            border-radius: 50px; font-size: 1rem; font-weight: 900; 
            margin-top: 25px; cursor: pointer; text-transform: uppercase;
        }

        #chestView { display: none; width: 100%; text-align: center; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }
        .box-item img { animation: floating 4s ease-in-out infinite; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { border: 2px solid var(--gold); border-radius: 30px; width: 85%; padding: 30px 20px; text-align: center; background: #000; }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container" id="mainScene">
        <div class="header-title">Nazimen қобдишасы</div>
        
        <div class="prize-grid">
            <div class="grid-item"><img src="iphone.png"><span>iPhone 17 Pro (XR)</span></div>
            <div class="grid-item"><img src="dyson.png"><span>Dyson</span></div>
            <div class="grid-item"><img src="golden.png"><span>Алтын</span></div>
            
            <div class="grid-item"><img src="bag.png"><span>Косметичка</span></div>
            <div class="grid-item car-accent">
                <div class="main-badge">БАСТЫ СЫЙЛЫҚ</div>
                <img src="elantra.png"><span>Elantra</span>
            </div>
            <div class="grid-item"><img src="money.png"><span>1 000 000₸</span></div>
            
            <div class="grid-item"><img src="parfum.png"><span>Парфюм</span></div>
            <div class="grid-item"><img src="nazzi.png"><span>Адвент</span></div>
            <div class="grid-item"><img src="satuar.png"><span>Сотуар</span></div>
            
            <div class="grid-item"><img src="cosmetic.png"><span>Косметика</span></div>
            <div class="grid-item"><img src="cushion.png"><span>Кушон</span></div>
            <div class="grid-item"><img src="china.png"><span>Қытайға бизнес тур</span></div>
        </div>
        
        <button class="btn-main" onclick="openChests()">Сыйлығымды ашу</button>
    </div>

    <div class="container" id="chestView">
        <h1 style="color:var(--gold); font-weight:900;">САНДЫҚТЫ ТАҢДАҢЫЗ</h1>
        <div class="chests-grid">
            <script>for(let i=0; i<12; i++) document.write('<div class="box-item" onclick="revealDrama(this)"><img src="chest.png" style="width:100%;"></div>');</script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 style="color:var(--gold); font-weight:900; margin-bottom: 20px;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <div id="wOut"></div>
            <div id="wId" style="color:var(--gold); font-size:0.8rem; margin:15px 0; border: 1px dashed var(--gold); padding: 5px; opacity: 0.7;"></div>
            <button class="btn-main" onclick="tg.close()">ЖАБУ</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": "#d4af37" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 2 },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 0.5, "direction": "top", "random": true }
            }
        });

        const tg = window.Telegram.WebApp; tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const p = urlParams.get('prize') || "Парфюм";
        const att = urlParams.get('attempt') || "ID-" + Math.floor(Math.random() * 9999);
        let isPlayed = localStorage.getItem('isPlayed_' + att); // ТЕК 1 РЕТ АШУ ЛОГИКАСЫ

        function openChests() { 
            if (isPlayed) {
                alert("Сіз бұл сыйлықты ашып қойғансыз!");
                return;
            }
            document.getElementById('mainScene').style.display='none'; 
            document.getElementById('chestView').style.display='flex'; 
        }

        function revealDrama(el) {
            if(isPlayed) return;
            isPlayed = true;
            localStorage.setItem('isPlayed_' + att, 'true'); // ID бойынша сақтау

            setTimeout(() => {
                const imgFile = "chest.png"; // Бұл жерде боттан келген сурет логикасы сақталған
                document.getElementById('wOut').innerHTML = `<h3 style="color:var(--gold);">${p}</h3>`;
                document.getElementById('wId').innerText = "СЫЙЛЫҚ ID: " + att; 
                document.getElementById('winModal').style.display='flex';
                confetti({particleCount: 150, spread: 70, origin: { y: 0.7 }});
            }, 700); 
        }
    </script>
</body>
</html>
