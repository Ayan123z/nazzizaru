<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nazimen Қобдишасы</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4); --navy: #000814; }
        body { 
            background: radial-gradient(circle at center, #001d3d 0%, #000814 100%); 
            color: #fff; font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }
        
        #particles-js { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none; opacity: 0.6;
        }

        /* 🕒 УАҚЫТ ПЕН ДАТА */
        #dateTime {
            position: fixed; top: 15px; right: 15px; text-align: right;
            font-size: 0.7rem; color: var(--gold); z-index: 100;
            font-weight: 700; text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .container { 
            width: 100%; max-width: 480px; margin: 0 auto; padding: 10px; 
            z-index: 10; position: relative; min-height: 95vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        
        .header-title {
            color: var(--gold); font-weight: 700; font-size: 1.1rem;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;
            text-align: center; text-shadow: 0 0 10px var(--gold-glow);
        }

        /* 📦 VIP МӨЛДІР ҰЯШЫҚТАР */
        .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 95%; margin: 10px 0; }
        
        .grid-item { 
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(212, 175, 55, 0.15); 
            border-radius: 15px; padding: 22px 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); animation: floating 4s ease-in-out infinite;
        }
        .grid-item img { width: 85%; height: 65px; object-fit: contain; }
        .grid-item span { 
            font-size: 0.55rem; font-weight: 800; margin-top: 10px; 
            color: #eee; text-align: center; text-transform: uppercase;
        }

        /* 🚗 ELANTRA CENTER */
        .car-accent { 
            grid-column: 2; grid-row: 2; border: 2px solid var(--gold); 
            box-shadow: 0 0 25px var(--gold-glow); transform: scale(1.15); 
            position: relative; background: rgba(212, 175, 55, 0.05);
        }
        .main-badge {
            position: absolute; top: -14px; background: linear-gradient(to right, #bf953f, #fcf6ba, #bf953f);
            color: #000; font-size: 0.5rem; font-weight: 900;
            padding: 3px 10px; border-radius: 4px; border: 1px solid #000; z-index: 30;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.5deg); }
        }

        .btn-main { 
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f); 
            color: #000; border: none; width: 85%; padding: 20px; 
            border-radius: 50px; font-size: 1rem; font-weight: 900; 
            margin-top: 25px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(212,175,55,0.3);
        }

        #chestView { display: none; width: 100%; text-align: center; }
        .chests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }
        .box-item img { animation: floating 3s ease-in-out infinite; width: 100%; cursor: pointer; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,8,20,0.98); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { border: 2px solid var(--gold); border-radius: 30px; width: 85%; padding: 35px 20px; text-align: center; background: #000; box-shadow: 0 0 50px var(--gold-glow); }
        
        #wOut img { width: 180px; height: auto; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--gold)); animation: prizePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes prizePop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div id="dateTime"></div>

    <div class="container" id="mainScene">
        <div class="header-title">Nazimen қобдишасы</div>
        
        <div class="prize-grid">
            <div class="grid-item"><img src="iphone.png"><span>iPhone 17 Pro (XR)</span></div>
            <div class="grid-item"><img src="dyson.png"><span>Dyson</span></div>
            <div class="grid-item"><img src="golden.png"><span>Алтын</span></div>
            
            <div class="grid-item"><img src="bag.png"><span>Косметичка</span></div>
            <div class="grid-item car-accent">
                <div class="main-badge">БАСТЫ СЫЙЛЫҚ</div>
                <img src="elantra.png"><span>Elantra</span>
            </div>
            <div class="grid-item"><img src="money.png"><span>1 000 000₸</span></div>
            
            <div class="grid-item"><img src="parfum.png"><span>Парфюм</span></div>
            <div class="grid-item"><img src="nazzi.png"><span>Адвент</span></div>
            <div class="grid-item"><img src="satuar.png"><span>Сотуар</span></div>
            
            <div class="grid-item"><img src="cosmetic.png"><span>Косметика</span></div>
            <div class="grid-item"><img src="cushion.png"><span>Кушон</span></div>
            <div class="grid-item" style="border-color: var(--gold);"><img src="china.png"><span>Қытайға бизнес тур</span></div>
        </div>
        
        <button class="btn-main" onclick="openChests()">Сыйлығымды ашу</button>
    </div>

    <div class="container" id="chestView">
        <h1 style="color:var(--gold); font-weight:900;">САНДЫҚТЫ ТАҢДАҢЫЗ</h1>
        <div class="chests-grid">
            <script>for(let i=0; i<12; i++) document.write('<div class="box-item" onclick="revealDrama(this)"><img src="chest.png"></div>');</script>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2 style="color:var(--gold); font-weight:900;">ҚҰТТЫҚТАЙМЫЗ!</h2>
            <div id="wOut"></div>
            <div id="wId" style="color:var(--gold); font-size:0.8rem; margin:15px 0; border: 1px dashed var(--gold); padding: 8px;"></div>
            <button class="btn-main" onclick="tg.close()">ЖАБУ</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ✨ УАҚЫТТЫ ЖАҢАРТУ ФУНКЦИЯСЫ
        function updateDateTime() {
            const now = new Date();
            const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('dateTime').innerText = now.toLocaleString('kk-KZ', options);
        }
        setInterval(updateDateTime, 1000); updateDateTime();

        // ✨ АЛТЫН ТІЗБЕКТЕРДІҢ ҚОЗҒАЛЫСЫ
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60 },
                "color": { "value": "#d4af37" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true },
                "size": { "value": 2.5, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#d4af37", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 1, "direction": "top", "random": true, "out_mode": "out" }
            }
        });

        const tg = window.Telegram.WebApp; tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const p = urlParams.get('prize') || "Парфюм";
        const att = urlParams.get('attempt') || "ID-" + Math.floor(Math.random() * 99999);
        
        let isPlayed = localStorage.getItem('p_' + att);

        const prizeImages = {
            "Алтын": "golden.png", "iPhone 17 Pro (XR)": "iphone.png", "Dyson": "dyson.png", "Парфюм": "parfum.png",
            "Косметичка": "bag.png", "Косметика": "cosmetic.png", "Elantra": "elantra.png",
            "1 000 000₸": "money.png", "Кушон": "cushion.png", "Қытайға бизнес тур": "china.png",
            "Сотуар": "satuar.png", "Адвент": "nazzi.png"
        };

        function openChests() { 
            if (isPlayed) { alert("Сіз бұл мүмкіндікті пайдаланып қойғансыз!"); return; }
            document.getElementById('mainScene').style.display='none'; 
            document.getElementById('chestView').style.display='flex'; 
        }

        function revealDrama(el) {
            if(isPlayed) return;
            isPlayed = true; localStorage.setItem('p_' + att, 'true');

            setTimeout(() => {
                const imgFile = prizeImages[p] || "chest.png";
                document.getElementById('wOut').innerHTML = `<img src="${imgFile}"><h3 style="color:var(--gold); text-transform:uppercase;">${p}</h3>`;
                document.getElementById('wId').innerText = "СЫЙЛЫҚ ID: " + att; 
                document.getElementById('winModal').style.display='flex';
                confetti({particleCount: 200, spread: 90, origin: { y: 0.7 }, colors: ['#d4af37', '#ffffff']});
            }, 800); 
        }
    </script>
</body>
</html>
